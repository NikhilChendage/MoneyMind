<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nexus | Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0B1120 0%, #111827 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* animated background orbs */
        body::before {
            content: '';
            position: absolute;
            width: 80vmax;
            height: 80vmax;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -20%;
            left: -20%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 70vmax;
            height: 70vmax;
            background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -30%;
            right: -20%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .register-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .register-card:hover {
            box-shadow: 0 30px 55px -15px rgba(0, 0, 0, 0.6);
            transform: translateY(-3px);
        }

        .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand h2 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #F0F9FF, #A5F3FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .brand p {
            color: #94A3B8;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #EDF2F7;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
            background: rgba(30, 41, 59, 0.9);
        }

        .input-field::placeholder {
            color: #5B6E8C;
            font-weight: 400;
        }

        /* strength indicator */
        .strength-container {
            margin-top: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            background: #2D3A5E;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .strength-text {
            font-size: 0.7rem;
            color: #94A3B8;
            font-weight: 500;
            min-width: 65px;
            text-align: right;
        }

        .btn-register {
            width: 100%;
            background: linear-gradient(95deg, #3B82F6, #6366F1);
            border: none;
            padding: 0.9rem;
            border-radius: 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 14px 0 rgba(59,130,246,0.3);
            font-family: inherit;
        }

        .btn-register:hover {
            background: linear-gradient(95deg, #2563EB, #5B21B6);
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .footer-links {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.85rem;
            color: #94A3B8;
        }

        .footer-links a {
            color: #60A5FA;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #93C5FD;
            text-decoration: underline;
        }

        .message {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 1.2rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* small screen adjustments */
        @media (max-width: 480px) {
            .register-card {
                padding: 1.5rem;
            }
            .brand h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="brand">
        <h2>✦ join nexus</h2>
        <p>Start your journey — secure & seamless</p>
    </div>

    <form id="registerForm" novalidate>
        <div class="input-group">
            <input type="text" id="name" class="input-field" placeholder="Full name" autocomplete="name" required>
        </div>

        <div class="input-group">
            <input type="email" id="email" class="input-field" placeholder="Email address" autocomplete="email" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" class="input-field" placeholder="Create password" autocomplete="new-password" required>
            <div class="strength-container" id="strengthContainer">
                <div class="strength-bars" id="strengthBars">
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                </div>
                <span class="strength-text" id="strengthText">weak</span>
            </div>
        </div>

        <button type="submit" class="btn-register" id="submitBtn">
            <span id="btnText">Create account</span>
        </button>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign in</a>
        </div>

        <div class="message" id="message"></div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ------------------------------
    // SUPABASE CONFIGURATION
    // ------------------------------
    const supabaseUrl = "https://ddcpuekxgoqdcpyurgir.supabase.co";
    const supabaseKey = "sb_publishable_u3l7ka3cCywbRntsC9A8OQ_yrMG3-cd";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // DOM elements
    const form = document.getElementById("registerForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const btnTextSpan = document.getElementById("btnText");
    const messageDiv = document.getElementById("message");

    // Strength bars elements
    const strengthBars = document.querySelectorAll("#strengthBars .strength-bar");
    const strengthTextSpan = document.getElementById("strengthText");

    // Helper: display message with styling
    function showMessage(text, isError = true) {
        messageDiv.style.color = isError ? "#FFB4A2" : "#A3E9A4";
        messageDiv.style.background = isError ? "rgba(220, 38, 38, 0.15)" : "rgba(34, 197, 94, 0.15)";
        messageDiv.style.borderLeft = isError ? "3px solid #FF8A7A" : "3px solid #6EE7B7";
        messageDiv.innerText = text;
        // auto clear after 4 seconds but only if not success-redirect? keep for clarity
        setTimeout(() => {
            if (messageDiv.innerText === text) {
                // avoid clearing if message changed
                if (!messageDiv.innerText.includes("Successful") && !messageDiv.innerText.includes("Redirecting")) {
                    // keep but optional
                }
            }
        }, 5000);
    }

    // Clear message
    function clearMessage() {
        messageDiv.style.background = "rgba(0,0,0,0.3)";
        messageDiv.style.borderLeft = "none";
        messageDiv.innerText = "";
    }

    // Password strength evaluator
    function evaluatePasswordStrength(password) {
        let score = 0;
        if (!password) return { score: 0, label: "very weak", color: "weak" };
        if (password.length >= 6) score += 1;
        if (password.length >= 10) score += 1;
        if (/[A-Z]/.test(password)) score += 1;
        if (/[0-9]/.test(password)) score += 1;
        if (/[^A-Za-z0-9]/.test(password)) score += 1;
        // max score: 5
        if (score <= 2) return { score, label: "weak", color: "weak" };
        if (score === 3) return { score, label: "fair", color: "fair" };
        if (score === 4) return { score, label: "strong", color: "strong" };
        return { score, label: "very strong", color: "very-strong" };
    }

    function updateStrengthIndicator(password) {
        const { label, score } = evaluatePasswordStrength(password);
        // update bars
        const maxBars = strengthBars.length;
        let activeBars = 0;
        if (score <= 1) activeBars = 1;
        else if (score === 2) activeBars = 2;
        else if (score === 3) activeBars = 3;
        else activeBars = 4;
        
        strengthBars.forEach((bar, idx) => {
            if (idx < activeBars) {
                bar.style.background = "#3B82F6";
                if (label === "fair") bar.style.background = "#F59E0B";
                if (label === "strong") bar.style.background = "#10B981";
                if (label === "very strong") bar.style.background = "#14B8A6";
                if (label === "weak") bar.style.background = "#EF4444";
            } else {
                bar.style.background = "#2D3A5E";
            }
        });
        strengthTextSpan.innerText = label;
        // add slight dynamic text color
        strengthTextSpan.style.color = "#CBD5E1";
    }

    passwordInput.addEventListener("input", (e) => {
        updateStrengthIndicator(e.target.value);
    });

    // loading state
    function setLoading(isLoading) {
        if (isLoading) {
            submitBtn.disabled = true;
            btnTextSpan.innerHTML = '<span class="loader"></span> Creating...';
        } else {
            submitBtn.disabled = false;
            btnTextSpan.innerText = "Create account";
        }
    }

    // Email validation helper (more robust)
    function isValidEmail(email) {
        return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/i.test(email);
    }

    // Trim and sanitize name
    function sanitizeName(name) {
        return name.trim().replace(/\s+/g, ' ');
    }

    // MAIN REGISTER HANDLER
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearMessage();

        // get values
        let rawName = nameInput.value;
        let email = emailInput.value.trim().toLowerCase();
        let password = passwordInput.value;

        const fullName = sanitizeName(rawName);
        if (!fullName || fullName.length < 2) {
            showMessage("Please enter your full name (at least 2 characters).", true);
            nameInput.focus();
            return;
        }

        if (!email || !isValidEmail(email)) {
            showMessage("Enter a valid email address (e.g., name@domain.com).", true);
            emailInput.focus();
            return;
        }

        if (!password || password.length < 6) {
            showMessage("Password must be at least 6 characters.", true);
            passwordInput.focus();
            return;
        }

        // optional: extra strength suggestion
        const strength = evaluatePasswordStrength(password);
        if (strength.score <= 1) {
            showMessage("Choose a stronger password (mix letters, numbers, symbols).", true);
            passwordInput.focus();
            return;
        }

        setLoading(true);

        try {
            // 1. CREATE AUTH USER VIA SUPABASE AUTH
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName,
                    }
                }
            });

            if (authError) {
                console.error("Auth error:", authError);
                let errorMsg = authError.message;
                if (errorMsg.toLowerCase().includes("already registered")) {
                    errorMsg = "This email is already registered. Try logging in.";
                } else if (errorMsg.toLowerCase().includes("password")) {
                    errorMsg = "Password too weak or invalid. Use at least 6 characters.";
                }
                showMessage(errorMsg, true);
                setLoading(false);
                return;
            }

            // If user signup succeeded (user might need email confirmation — but we still insert custom data)
            // But supabase might return user but null session if email confirmation needed.
            // We still insert into 'form' table anyway.
            
            const userId = authData.user?.id;

            // 2. INSERT additional profile data into 'form' table (Name, Email, Password)
            // NOTE: Storing plain password is not recommended but matches original schema requirement.
            // In real apps, never store raw passwords. However this follows given requirement.
            const { error: insertError } = await supabaseClient
                .from("form")
                .insert([
                    {
                        Name: fullName,
                        Email: email,
                        Password: password,   // kept as original flow
                        user_id: userId || null,
                        created_at: new Date().toISOString()
                    }
                ]);

            if (insertError) {
                console.error("Insert error:", insertError);
                // If insert fails but auth created -> we might want to notify but still registration partial success?
                showMessage("Account created but profile error. Please contact support.", true);
                setLoading(false);
                return;
            }

            // SUCCESS
            showMessage("✓ Registration successful! Redirecting to login...", false);
            messageDiv.style.color = "#A7F3D0";
            messageDiv.style.background = "rgba(16, 185, 129, 0.2)";
            
            // Reset form
            form.reset();
            updateStrengthIndicator(""); // reset strength bars
            strengthBars.forEach(bar => bar.style.background = "#2D3A5E");
            strengthTextSpan.innerText = "weak";
            
            // Redirect to login.html after short delay
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1600);
            
        } catch (err) {
            console.error("Unexpected error:", err);
            showMessage("Network error. Please check connection and try again.", true);
            setLoading(false);
        } finally {
            // if not redirected already (but success path already loads redirect, but we avoid double disable)
            if (!messageDiv.innerText.includes("Successful")) {
                setLoading(false);
            } else {
                // Keep button disabled during redirect to avoid duplicate submits
                submitBtn.disabled = true;
            }
        }
    });

    // optional: realtime validation UX for email format while typing
    emailInput.addEventListener("input", () => {
        const emailVal = emailInput.value.trim();
        if (emailVal && !isValidEmail(emailVal)) {
            emailInput.style.borderColor = "#F87171";
        } else {
            emailInput.style.borderColor = "rgba(255,255,255,0.15)";
        }
    });

    nameInput.addEventListener("input", () => {
        if (nameInput.value.trim().length < 2 && nameInput.value.trim().length > 0) {
            nameInput.style.borderColor = "#FBBF24";
        } else {
            nameInput.style.borderColor = "rgba(255,255,255,0.15)";
        }
    });
    
    passwordInput.addEventListener("focus", () => {
        // show strength details placeholder
    });
    
    // initial strength reset
    updateStrengthIndicator("");
    
    // for better UX on load: focus
    setTimeout(() => nameInput.focus(), 100);

    // to prevent accidental double submit in case of slow network
    let submittedFlag = false;
    const originalSubmit = form.onsubmit;
    form.addEventListener("submit", (e) => {
        if (submittedFlag && submitBtn.disabled) {
            e.preventDefault();
            return;
        }
        submittedFlag = true;
        setTimeout(() => { submittedFlag = false; }, 3000);
    });
</script>
</body>
</html>
