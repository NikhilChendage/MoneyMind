<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0B1120,#111827);
            padding:20px;
        }

        .card{
            width:400px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#1E293B;
            color:white;
            font-size:15px;
        }

        .input-box input::placeholder{
            color:#94A3B8;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#3B82F6;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#2563EB;
        }

        .message{
            margin-top:15px;
            text-align:center;
            color:white;
            font-weight:bold;
        }

        .link{
            text-align:center;
            margin-top:15px;
            color:#CBD5E1;
        }

        .link a{
            color:#60A5FA;
            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="input-box">
                <input
                    type="text"
                    id="name"
                    placeholder="Enter Full Name"
                    required
                >
            </div>

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Register
            </button>

            <div class="message" id="message"></div>

            <div class="link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </form>

    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // SUPABASE CONFIG
        const supabaseUrl =
        "https://ddcpuekxgoqdcpyurgir.supabase.co";

        const supabaseKey =
        "sb_publishable_u3l7ka3cCywbRntsC9A8OQ_yrMG3-cd";

        const supabaseClient =
        supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        const message =
        document.getElementById("message");

        // REGISTER
        document
        .getElementById("registerForm")
        .addEventListener("submit",
        async function(e){

            e.preventDefault();

            const fullName =
            document.getElementById("name").value;

            const email =
            document.getElementById("email").value;

            const password =
            document.getElementById("password").value;

            // CREATE AUTH USER
            const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,
                password: password

            });

            if(error){

                message.style.color = "red";

                message.innerText =
                error.message;

                return;
            }

            // INSERT INTO DATABASE
            const { error: insertError } =
            await supabaseClient
            .from("form")
            .insert([
                {
                    Name: fullName,
                    Email: email,
                    Password: password
                }
            ]);

            if(insertError){

                console.log(insertError);

                message.style.color = "red";

                message.innerText =
                insertError.message;

                return;
            }

            // SUCCESS
            message.style.color = "#4ADE80";

            message.innerText =
            "Registration Successful";

            // REDIRECT
            setTimeout(() => {

                window.location.href =
                "login.html";

            }, 1500);

        });

    </script>

</body>
</html>
