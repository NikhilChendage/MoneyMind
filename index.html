<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registration Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .register-box{
            width:380px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        .register-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
            font-size:15px;
        }

        .input-box input:focus{
            border-color:#007bff;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#0056b3;
        }

        .text{
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }

        .text a{
            color:#007bff;
            text-decoration:none;
        }

        .message{
            margin-top:15px;
            text-align:center;
            font-size:14px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="input-box">
                <input 
                    type="text"
                    id="name"
                    placeholder="Enter Full Name"
                    required
                >
            </div>

            <div class="input-box">
                <input 
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="input-box">
                <input 
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Register
            </button>

            <div class="text">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

            <div class="message" id="message"></div>

        </form>

    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // SUPABASE CONFIG
        const supabaseUrl =
        "https://ddcpuekxgoqdcpyurgir.supabase.co";

        const supabaseKey =
        "sb_publishable_u3l7ka3cCywbRntsC9A8OQ_yrMG3-cd";

        // CREATE CLIENT
        const supabaseClient =
        supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        // MESSAGE BOX
        const message =
        document.getElementById("message");

        // REGISTER FORM
        document
        .getElementById("registerForm")
        .addEventListener("submit",
        async function(e){

            e.preventDefault();

            const name =
            document.getElementById("name").value;

            const email =
            document.getElementById("email").value;

            const password =
            document.getElementById("password").value;

            // REGISTER USER
            const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,
                password: password,

                options: {
                    data: {
                        full_name: name
                    }
                }

            });

            if(error){

                message.style.color = "red";

                message.innerText =
                "Registration Failed : " + error.message;

            }
            else{

                message.style.color = "green";

                message.innerText =
                "Registration Successful";

                console.log(data);

                // REDIRECT
                setTimeout(() => {

                    window.location.href =
                    "login.html";

                }, 1500);

            }

        });

    </script>

</body>
</html>
