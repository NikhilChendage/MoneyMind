<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f2f2f2;
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:20px;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:5px;
            outline:none;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        .btn:hover{
            background:#0056b3;
        }

        .text{
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }

        .text a{
            color:#007bff;
            text-decoration:none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form id="loginForm">

            <div class="input-box">
                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter Email" 
                    required
                >
            </div>

            <div class="input-box">
                <input 
                    type="password" 
                    id="password"
                    placeholder="Enter Password" 
                    required
                >
            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <div class="text">
                Don't have an account?
                <a href="#">Register</a>
            </div>

        </form>

    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // YOUR SUPABASE DETAILS
        const supabaseUrl = "https://ddcpuekxgoqdcpyurgir.supabase.co";

        const supabaseKey = "YOUR_ANON_PUBLIC_KEY";

        // CREATE CLIENT
        const supabaseClient = supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        // LOGIN FORM
        document
        .getElementById("loginForm")
        .addEventListener("submit", async function(e){

            e.preventDefault();

            const email = document.getElementById("email").value;

            const password = document.getElementById("password").value;

            // LOGIN
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if(error){
                alert("Login Failed : " + error.message);
            }
            else{
                alert("Login Successful");

                console.log(data);

                // Redirect after login
                window.location.href = "dashboard.html";
            }

        });

    </script>

</body>
</html>
