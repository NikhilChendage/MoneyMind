<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nexus Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0B1120,#111827);
            padding:20px;
        }

        .login-card{
            width:400px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        .title{
            text-align:center;
            color:white;
            margin-bottom:25px;
        }

        .title h2{
            margin-bottom:8px;
        }

        .title p{
            color:#94A3B8;
            font-size:14px;
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#1E293B;
            color:white;
            font-size:15px;
        }

        .input-box input::placeholder{
            color:#94A3B8;
        }

        .password-wrapper{
            position:relative;
        }

        .toggle-btn{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:#94A3B8;
            cursor:pointer;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#3B82F6;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#2563EB;
        }

        .message{
            margin-top:15px;
            text-align:center;
            padding:12px;
            border-radius:10px;
            font-weight:bold;
            color:white;
        }

        .footer{
            margin-top:20px;
            text-align:center;
            color:#CBD5E1;
        }

        .footer a{
            color:#60A5FA;
            text-decoration:none;
        }

        .dashboard{
            text-align:center;
            color:white;
        }

        .dashboard h1{
            margin-bottom:15px;
        }

        .logout-btn{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#EF4444;
            color:white;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="login-card" id="loginCard">

        <div class="title">
            <h2>✦ Welcome Back</h2>
            <p>Login to continue</p>
        </div>

        <form id="loginForm">

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="input-box">
                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-btn"
                        id="togglePassword"
                    >
                        Show
                    </button>

                </div>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <div class="message" id="message"></div>

            <div class="footer">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </div>

        </form>

    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // SUPABASE CONFIG
        const supabaseUrl =
        "https://ddcpuekxgoqdcpyurgir.supabase.co";

        const supabaseKey =
        "sb_publishable_u3l7ka3cCywbRntsC9A8OQ_yrMG3-cd";

        const supabaseClient =
        supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        // ELEMENTS
        const form =
        document.getElementById("loginForm");

        const message =
        document.getElementById("message");

        const passwordInput =
        document.getElementById("password");

        const togglePassword =
        document.getElementById("togglePassword");

        // SHOW / HIDE PASSWORD
        togglePassword.addEventListener(
            "click",
            function(){

                if(passwordInput.type === "password"){

                    passwordInput.type = "text";

                    togglePassword.innerText = "Hide";

                }
                else{

                    passwordInput.type = "password";

                    togglePassword.innerText = "Show";

                }

            }
        );

        // LOGIN
        form.addEventListener(
            "submit",
            async function(e){

                e.preventDefault();

                const email =
                document
                .getElementById("email")
                .value;

                const password =
                document
                .getElementById("password")
                .value;

                // LOGIN AUTH
                const {
                    data: authData,
                    error: loginError
                }
                =
                await supabaseClient.auth
                .signInWithPassword({

                    email: email,
                    password: password

                });

                // LOGIN ERROR
                if(loginError){

                    message.style.background =
                    "rgba(239,68,68,0.2)";

                    message.style.color =
                    "#FCA5A5";

                    message.innerText =
                    loginError.message;

                    return;

                }

                // FETCH USER NAME
                const {
                    data: profileData,
                    error: fetchError
                }
                =
                await supabaseClient
                .from("form")
                .select("Name")
                .eq("Email", email)
                .maybeSingle();

                let displayName = "User";

                if(profileData && profileData.Name){

                    displayName =
                    profileData.Name;

                }

                // SAVE USER NAME
                localStorage.setItem(
                    "nexus_user",
                    displayName
                );

                // SUCCESS MESSAGE
                message.style.background =
                "rgba(34,197,94,0.2)";

                message.style.color =
                "#BBF7D0";

                message.innerText =
                "Welcome " + displayName;

                // REDIRECT TO DASHBOARD
                setTimeout(() => {

                    showDashboard(displayName);

                }, 1500);

            }
        );

        // DASHBOARD
        function showDashboard(username){

            const loginCard =
            document.getElementById("loginCard");

            loginCard.innerHTML = `

                <div class="dashboard">

                    <h1>
                        Welcome ${username}
                    </h1>

                    <p>
                        You are successfully logged in.
                    </p>

                    <button
                        class="logout-btn"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            `;

        }

        // LOGOUT
        async function logout(){

            await supabaseClient.auth.signOut();

            localStorage.removeItem(
                "nexus_user"
            );

            location.reload();

        }

        // AUTO LOGIN
        const savedUser =
        localStorage.getItem(
            "nexus_user"
        );

        if(savedUser){

            showDashboard(savedUser);

        }

    </script>

</body>
</html>
