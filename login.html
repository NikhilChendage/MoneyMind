<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:20px;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:6px;
            cursor:pointer;
        }

        .message{
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form id="loginForm">

            <div class="input-box">
                <input 
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="input-box">
                <input 
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <div class="message" id="message"></div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const supabaseUrl =
        "https://ddcpuekxgoqdcpyurgir.supabase.co";

        const supabaseKey =
        "sb_publishable_u3l7ka3cCywbRntsC9A8OQ_yrMG3-cd";

        const supabaseClient =
        supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        const message =
        document.getElementById("message");

        document
        .getElementById("loginForm")
        .addEventListener("submit",
        async function(e){

            e.preventDefault();

            const email =
            document.getElementById("email").value;

            const password =
            document.getElementById("password").value;

            const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,
                password: password

            });

            if(error){

                message.style.color = "red";

                message.innerText =
                error.message;

            }
            else{

                message.style.color = "green";

                message.innerText =
                "Login Successful";

                console.log(data);

            }

        });

    </script>

</body>
</html>
