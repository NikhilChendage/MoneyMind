<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0B1120,#111827);
            color:white;
        }

        .card{
            width:400px;
            background:rgba(255,255,255,0.08);
            padding:40px;
            border-radius:20px;
            text-align:center;
            backdrop-filter:blur(10px);
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        h1{
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:25px;
        }

        .logout-btn{
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#3B82F6;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .logout-btn:hover{
            background:#2563EB;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1 id="welcomeText">
            Welcome
        </h1>

        <p>
            You are successfully logged in.
        </p>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const supabaseUrl =
        "https://ddcpuekxgoqdcpyurgir.supabase.co";

        const supabaseKey =
        "sb_publishable_u3l7ka3cCywbRntsC9A8OQ_yrMG3-cd";

        const supabaseClient =
        supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        // GET USER NAME
        const username =
        localStorage.getItem("nexus_user");

        document
        .getElementById("welcomeText")
        .innerText =
        "Welcome " + username;

        // LOGOUT
        async function logout(){

            await supabaseClient.auth.signOut();

            localStorage.removeItem("nexus_user");

            window.location.href =
            "login.html";

        }

    </script>

</body>
</html>
